name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: pub.dev publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Verify version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pubspec_version=$(grep '^version: ' packages/nativeflow_bridge/pubspec.yaml | awk '{print $2}')
          if [ "$tag" != "$pubspec_version" ]; then
            echo "Tag $tag does not match pubspec version $pubspec_version" >&2
            exit 1
          fi
      - name: Setup pub credentials via OIDC
        uses: dart-lang/setup-dart@v1
      - name: pub publish
        working-directory: packages/nativeflow_bridge
        run: dart pub publish --force
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
