version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/packages/nativeflow_bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - ci
  - package-ecosystem: "gradle"
    directory: "/packages/nativeflow_bridge/android"
    schedule:
      interval: "monthly"
    labels:
      - android
