name: nativeflow_bridge_workspace
description: Workspace tooling for the NativeFlow Bridge monorepo.
publish_to: none
homepage: https://github.com/Anu-Code07/flutter-native-bridge
repository: https://github.com/Anu-Code07/flutter-native-bridge
issue_tracker: https://github.com/Anu-Code07/flutter-native-bridge/issues

environment:
  sdk: ">=3.7.0 <4.0.0"

workspace:
  - packages/nativeflow_bridge
  - packages/bridge_annotations
  - packages/bridge_core
  - packages/bridge_generator
  - packages/bridge_runtime
  - packages/bridge_android
  - packages/bridge_ios
  - packages/bridge_macos
  - packages/bridge_windows
  - packages/bridge_linux
  - packages/bridge_ffi
  - packages/bridge_devtools
  - examples/payment_sdk_wrapper
  - examples/ai_image_processor
  - examples/kyc_document_capture

melos:
  scripts:
    analyze:
      description: Analyze every Dart package.
      run: melos exec -- "dart analyze ."

    test:
      description: Run package tests.
      run: melos exec --dir-exists=test -- "dart test"

    format:
      description: Format Dart sources.
      run: melos exec -- "dart format --set-exit-if-changed ."

    generate:
      description: Run build_runner in packages that use code generation.
      run: melos exec --depends-on=build_runner -- "dart run build_runner build"

    native:check:
      description: Validate native platform folders exist on the published package.
      run: melos exec --scope="nativeflow_bridge" -- "test -d android && test -d ios"

dev_dependencies:
  melos: ^7.7.0
