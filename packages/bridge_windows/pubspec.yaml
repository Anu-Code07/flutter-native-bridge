name: nativeflow_bridge_windows
description: Windows C++ runtime shell for generated NativeFlow Bridge Flutter plugins and native bridges.
version: 0.1.0
homepage: https://github.com/Anu-Code07/flutter-native-bridge
repository: https://github.com/Anu-Code07/flutter-native-bridge
issue_tracker: https://github.com/Anu-Code07/flutter-native-bridge/issues
documentation: https://github.com/Anu-Code07/flutter-native-bridge/tree/main/docs

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

resolution: workspace

topics:
  - flutter
  - windows
  - native
  - bridge

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: NativeFlowBridgeWindowsPlugin
