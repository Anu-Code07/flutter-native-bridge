name: nativeflow_bridge_generator
description: Source generation engine for NativeFlow Bridge Dart, Kotlin, and Swift contracts.
version: 0.1.0
repository: https://github.com/nativeflow/nativeflow_bridge

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  analyzer: ^6.11.0
  build: ^2.4.2
  nativeflow_bridge_annotations:
    path: ../bridge_annotations
  nativeflow_bridge_core:
    path: ../bridge_core
  source_gen: ^1.5.0

dev_dependencies:
  build_test: ^2.2.2
  test: ^1.25.15
