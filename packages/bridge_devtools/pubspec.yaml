name: nativeflow_bridge_devtools
description: DevTools integration foundation for inspecting NativeFlow Bridge traffic.
version: 0.1.0
repository: https://github.com/nativeflow/nativeflow_bridge

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  nativeflow_bridge_core:
    path: ../bridge_core
  nativeflow_bridge_runtime:
    path: ../bridge_runtime

flutter:
  assets:
    - extension/devtools/config.yaml
