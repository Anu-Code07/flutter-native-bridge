name: nativeflow_bridge_macos
description: macOS Swift runtime shell for generated NativeFlow Bridge plugins.
version: 0.1.0
repository: https://github.com/nativeflow/nativeflow_bridge

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: NativeFlowBridgeMacosPlugin
