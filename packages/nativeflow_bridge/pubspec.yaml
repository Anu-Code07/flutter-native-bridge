name: nativeflow_bridge
description: Type-safe Flutter-native bridge framework with code generation, runtime, platform plugins, FFI, and DevTools.
version: 1.0.0
license: MIT
homepage: https://github.com/Anu-Code07/flutter-native-bridge
repository: https://github.com/Anu-Code07/flutter-native-bridge
issue_tracker: https://github.com/Anu-Code07/flutter-native-bridge/issues
documentation: https://pub.dev/documentation/nativeflow_bridge/latest/

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

topics:
  - flutter
  - native
  - bridge
  - codegen

dependencies:
  analyzer: ">=7.0.0 <14.0.0"
  build: ^4.0.6
  flutter:
    sdk: flutter
  meta: ">=1.15.0 <2.0.0"
  source_gen: ^4.2.3

dev_dependencies:
  build_test: ^3.2.1
  flutter_test:
    sdk: flutter
  test: ^1.25.15

flutter:
  plugin:
    platforms:
      android:
        package: nativeflow.bridge.android
        pluginClass: NativeFlowBridgePlugin
      ios:
        pluginClass: NativeFlowBridgePlugin
      macos:
        pluginClass: NativeFlowBridgeMacosPlugin
      windows:
        pluginClass: NativeFlowBridgeWindowsPlugin
      linux:
        pluginClass: NativeFlowBridgeLinuxPlugin
