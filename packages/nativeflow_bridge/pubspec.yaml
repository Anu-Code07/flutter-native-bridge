name: nativeflow_bridge
description: Single public Flutter package for NativeFlow Bridge annotations, code generation, runtime, platform shells, FFI, and DevTools APIs.
version: 0.1.0
homepage: https://github.com/Anu-Code07/flutter-native-bridge
repository: https://github.com/Anu-Code07/flutter-native-bridge
issue_tracker: https://github.com/Anu-Code07/flutter-native-bridge/issues
documentation: https://github.com/Anu-Code07/flutter-native-bridge/tree/main/docs
author: Anurag

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

resolution: workspace

topics:
  - flutter
  - native
  - bridge
  - codegen

dependencies:
  flutter:
    sdk: flutter
  nativeflow_bridge_android: ^0.1.0
  nativeflow_bridge_annotations: ^0.1.0
  nativeflow_bridge_core: ^0.1.0
  nativeflow_bridge_devtools: ^0.1.0
  nativeflow_bridge_ffi: ^0.1.0
  nativeflow_bridge_generator: ^0.1.0
  nativeflow_bridge_ios: ^0.1.0
  nativeflow_bridge_linux: ^0.1.0
  nativeflow_bridge_macos: ^0.1.0
  nativeflow_bridge_runtime: ^0.1.0
  nativeflow_bridge_windows: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
